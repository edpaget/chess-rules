name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI needs only Ruby; mise run would otherwise auto-install hk and pkl.
  MISE_DISABLE_TOOLS: "hk,pkl"
  # Outside the workspace so rubocop never scans installed gems.
  BUNDLE_PATH: /home/runner/.cache/bundle

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "ruby"
          cache: true
          github_token: ${{ github.token }}
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/bundle
          key: bundle-${{ runner.os }}-ruby-pinned-${{ hashFiles('Gemfile.lock') }}
      - run: mise run lint

  spec:
    name: spec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    # Red by construction until task fix-ecs-component-delegate lands;
    # remove this flag in that change or it becomes a permanent silent gap.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted 4.0 is read by YAML as the float 4.
        ruby: ["3.3", "3.4", "4.0"]
    env:
      MISE_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "ruby"
          cache: true
          # The default key ignores MISE_RUBY_VERSION; keep one cache per Ruby.
          cache_key: "{{default}}-ruby-${{ matrix.ruby }}"
          github_token: ${{ github.token }}
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/bundle
          key: bundle-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ hashFiles('Gemfile.lock') }}
      - name: Assert Ruby version
        run: |
          mise exec -- ruby -e 'v = ENV.fetch("MISE_RUBY_VERSION"); abort("expected Ruby #{v}, got #{RUBY_VERSION}") unless RUBY_VERSION.start_with?("#{v}."); puts RUBY_DESCRIPTION'
      - run: mise run test
